[package]
name = "nyaterm-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Native plugin SDK for NyaTerm's scoped JSON-RPC sidecar protocol"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
