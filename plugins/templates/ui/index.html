<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NyaTerm plugin starter</title>
    <style>
      body {
        margin: 16px;
        font: 14px/1.5 var(--font-sans, system-ui, sans-serif);
        background: var(--df-bg, #111827);
        color: var(--df-fg, #e5e7eb);
      }
      button {
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>Hello, NyaTerm</h1>
    <button id="run" type="button">Run example</button>
    <pre id="output" aria-live="polite"></pre>
    <script src="nyaterm-sdk.js"></script>
    <script src="main.js"></script>
  </body>
</html>
