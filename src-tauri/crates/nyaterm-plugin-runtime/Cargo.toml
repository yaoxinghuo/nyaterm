[package]
name = "nyaterm-plugin-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
nyaterm-gpu = { path = "../nyaterm-gpu" }
async-trait = "0.1"
hex = "0.4"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[features]
sdk-fixture = ["dep:nyaterm-plugin-sdk"]

[dependencies.nyaterm-plugin-sdk]
path = "../../../plugins/sdk/rust/nyaterm-plugin-sdk"
optional = true

[[bin]]
name = "sdk-fixture"
path = "src/bin/sdk-fixture.rs"
required-features = ["sdk-fixture"]

[[bin]]
name = "gpu-fixture"
path = "../../../plugins/examples/gpu-monitor/backend/src/main.rs"
required-features = ["sdk-fixture"]
