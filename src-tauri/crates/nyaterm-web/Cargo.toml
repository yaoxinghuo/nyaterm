[package]
name = "nyaterm-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
nyaterm-core = { path = "../nyaterm-core" }
nyaterm-otp = { path = "../otp" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt", "io"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
url = "2"
async-stream = "0.3"
subtle = "2"
russh = { path = "../../vendor/russh/russh", default-features = false, features = ["des", "dsa", "flate2", "ring", "rsa"] }
russh-sftp = { path = "../../vendor/russh-sftp" }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
time = { version = "0.3", features = ["formatting"] }
zip = "8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"


tokio-tungstenite = "0.29"
rand-new = { package = "rand", version = "0.10" }
