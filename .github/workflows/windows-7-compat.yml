name: Windows 7 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-7-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win7:
    name: Build Windows 7 x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Win7 offline installer
        id: win7
        uses: ./.github/actions/build-win7
        with:
          include-diagnostics: "true"

      - name: Upload Win7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyaterm-windows-7-x64
          path: ${{ steps.win7.outputs.artifact-dir }}/*
          if-no-files-found: error

  modern-windows-regression:
    name: Modern Windows x64 regression
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare official ConPTY package
        run: pnpm prepare:conpty

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
          key: windows-2022-x86_64-pc-windows-msvc

      - name: Build modern Windows target without bundle
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --ci

      - name: Verify bundled ConPTY and system fallback
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test conpty_backend
