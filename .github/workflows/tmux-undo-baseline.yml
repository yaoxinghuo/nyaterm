name: tmux Undo baseline diagnosis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    # Temporary diagnosis for #1080; the original snapshots intentionally fail.
    if: github.event.pull_request.number == 1080
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-macos-arm64
      - name: Reproduce original PR and main baseline on the same runner
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          for snapshot in \
            main:00cd90c174a254913f5512ae9dfb32e3b944fb15 \
            pr:9d0056b670e9fb8c4ab1e2eb5b8bf8d1bcb93856; do
            label="${snapshot%%:*}"
            revision="${snapshot#*:}"
            candidate="$RUNNER_TEMP/tmux-undo-$label"
            git worktree add --detach "$candidate" "$revision"
            set +e
            cargo test --manifest-path "$candidate/Cargo.toml" -p nyaterm-desktop --lib \
              quick_command_editor_literal_toggle_preserves_the_editor_selection_and_undo_in_both_surfaces \
              --locked > "$RUNNER_TEMP/tmux-undo-$label.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/tmux-undo-$label.log"
            test "$result" -ne 0
            grep -F 'left: "aX"' "$RUNNER_TEMP/tmux-undo-$label.log"
            grep -F 'right: "abc"' "$RUNNER_TEMP/tmux-undo-$label.log"
          done
      - name: Verify platform shortcut fix on the same runner
        run: |
          # The initial checkout predates both worktree builds. Cargo may
          # reuse their newer same-package artifacts in the shared target.
          touch crates/nyaterm-transport/src/lib.rs
          touch crates/nyaterm-desktop/src/features/panels/quick_commands_panel/panel/tests.rs
          cargo test -p nyaterm-desktop --lib \
            quick_command_editor_literal_toggle_preserves_the_editor_selection_and_undo_in_both_surfaces \
            --locked
