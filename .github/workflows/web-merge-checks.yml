name: Web merge checks
on:
  pull_request:
  push:
    branches: [main, feat/web-deployment]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm i18n:check && pnpm i18n:keys
      - run: pnpm test --run --maxWorkers=4
      - run: pnpm build:web
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libfreetype-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/crates/nyaterm-core -> target
            src-tauri/crates/nyaterm-web -> target
      - run: cargo test --manifest-path src-tauri/crates/nyaterm-core/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/crates/nyaterm-web/Cargo.toml --locked
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libudev-dev libfontconfig1-dev libfreetype-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/crates/nyaterm-mcp -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mcp-sidecar
      - run: pnpm prepare:conpty
        if: runner.os == 'Windows'
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-deployment-failure
          path: artifacts/web-e2e/
          retention-days: 7
