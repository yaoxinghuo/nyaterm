name: ✨ 功能建议 / Feature request
description: 提出 NyaTerm 新功能或改进建议 / Suggest an idea or enhancement for NyaTerm
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 我已搜索现有的 Issue（包括已关闭的），确认这不是重复建议。 / I have searched the existing issues, both open and closed, to make sure this is not a duplicate request.
      options:
        - label: "是 / Yes"
          required: true

  - type: markdown
    attributes:
      value: |
        感谢你为 NyaTerm 提出改进建议。

        请重点描述你想解决的问题，而不仅仅是期望的解决方案。

        Thanks for taking the time to suggest an improvement for NyaTerm.

        Please describe the problem you are trying to solve, not just the solution you want.

  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: 问题描述 / Problem description
      description: 你遇到了什么问题、限制或不便？ / What problem, limitation, or inconvenience are you experiencing?
      placeholder: |
        例如 / For example:
        我经常需要连接多个 SSH 主机，但目前很难……
        I often need to connect to multiple SSH hosts, but currently it is difficult to...

  - type: textarea
    id: solution
    validations:
      required: true
    attributes:
      label: 建议方案 / Proposed solution
      description: 请描述你希望增加的功能或改进。 / Describe the feature or enhancement you would like to see.
      placeholder: |
        例如 / For example:
        增加连接配置管理器，用于保存主机、端口、用户名和启动命令。
        Add a connection profile manager that allows users to save hosts, ports, usernames, and startup commands.

  - type: textarea
    id: alternatives
    validations:
      required: false
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 你是否考虑过其他解决方案或临时替代方式？ / Have you considered any alternative solutions or workarounds?
      placeholder: |
        例如 / For example:
        我目前使用脚本或外部 SSH 配置，但它与 NyaTerm 的集成不够好。
        I currently use a script or external SSH config, but it does not integrate well with NyaTerm.

  - type: dropdown
    id: area
    validations:
      required: true
    attributes:
      label: 改进范围 / Area of improvement
      description: 这个建议与 NyaTerm 的哪一部分相关？ / Which part of NyaTerm does this request relate to?
      options:
        - 终端 / Terminal
        - SSH / 远程连接 / Remote connection
        - UI / UX
        - 主题 / 外观 / Themes / Appearance
        - 设置 / 配置 / Settings / Configuration
        - 键盘快捷键 / Keyboard shortcuts
        - 标签页 / 会话 / Tabs / Sessions
        - 性能 / Performance
        - 打包 / 安装 / Packaging / Installation
        - 文档 / Documentation
        - 其他 / Other

  - type: dropdown
    id: platform
    validations:
      required: true
    attributes:
      label: 目标平台 / Target platform
      description: 你希望这个功能支持哪些平台？ / Which platform should this feature support?
      options:
        - Windows
        - macOS
        - Linux
        - 全部平台 / All platforms
        - 与平台无关 / Not platform-specific

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与贡献 / Willingness to contribute
      description: 如果你愿意参与实现或测试，请告诉我们。 / Let us know if you are willing to help with this feature.
      options:
        - label: 我愿意为此功能提交 Pull Request。 / I am willing to submit a pull request for this feature.
        - label: 我愿意协助测试此功能。 / I am willing to help test this feature.

  - type: textarea
    id: additional-context
    validations:
      required: false
    attributes:
      label: 补充信息 / Additional context
      description: 可在此添加截图、原型、示例、链接或其他信息。 / Add any screenshots, mockups, examples, links, or extra information here.
      placeholder: |
        你可以附上截图、示意图、参考资料，或其他工具中类似行为的示例。
        You can attach screenshots, diagrams, references, or examples of similar behavior in other tools.

  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 NyaTerm。 / Thank you for helping improve NyaTerm.
