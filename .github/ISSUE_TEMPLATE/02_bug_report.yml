name: 🐛 稳定版 Bug / Stable release bug
description: 报告当前 NyaTerm 稳定版本中遇到的问题 / Report an issue with the current stable release of NyaTerm
title: "[Bug]: "
labels: ["bug"]

body:
  - type: checkboxes
    attributes:
      label: 我已搜索现有的 Issue（包括已关闭的），确认这不是重复报告。 / I have searched the existing issues, both open and closed, to make sure this is not a duplicate report.
      options:
        - label: '是 / Yes'
          required: true

  - type: markdown
    attributes:
      value: |
        此表单仅用于报告当前稳定版本中的 Bug。
        如果你使用的是 GPUI Preview 版本（例如 `v2.0.0-preview.1`），请使用 [GPUI Preview Bug 表单](https://github.com/nyakang/nyaterm/issues/new?template=01_gpui_preview_bug.yml)。
        如果你想提出新功能或改进建议，请使用 [功能建议表单](https://github.com/nyakang/nyaterm/issues/new?template=03_feature_request.yml)。

        This form is only for reporting bugs in the current stable release.
        If you are using a GPUI Preview release (for example `v2.0.0-preview.1`), please use the [GPUI Preview bug report](https://github.com/nyakang/nyaterm/issues/new?template=01_gpui_preview_bug.yml).
        If you have a feature or enhancement request, please use the [feature request](https://github.com/nyakang/nyaterm/issues/new?template=03_feature_request.yml).

  - type: textarea
    id: bug
    validations:
      required: true
    attributes:
      label: 问题描述 / Bug description
      description: >-
        请描述你遇到的问题，包括你尝试执行的操作、实际发生的情况以及预期行为。
        Describe the issue you are experiencing, what you were trying to do,
        what happened, and what you expected to happen.

  - type: markdown
    attributes:
      value: |
        ## 运行环境 / Environment

  - type: input
    id: os
    validations:
      required: true
    attributes:
      label: NyaTerm 运行的操作系统 / Operating system
      placeholder: Windows 10, Windows 11, macOS 14, Ubuntu 22.04...etc

  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: NyaTerm 版本 / NyaTerm version
      placeholder: v1.0.0

  - type: dropdown
    id: install-method
    validations:
      required: true
    attributes:
      label: 安装方式 / Installation method
      options:
        - 从 GitHub Releases 下载 / Downloaded from GitHub Releases
        - 从源码构建 / Built from source
        - 包管理器 / Package manager
        - 其他 / Other

  - type: input
    id: shell
    attributes:
      label: Shell / 命令行环境
      placeholder: PowerShell 7, cmd, zsh, bash, fish...etc

  - type: textarea
    id: repro
    validations:
      required: true
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 请逐步说明如何触发这个问题。 / How do you trigger this bug? Please walk us through it step by step.
      value: |
        1.
        2.
        3.
        ...

  - type: textarea
    id: logs
    validations:
      required: false
    attributes:
      label: 相关日志 / Relevant log output
      description: >-
        请在下方粘贴相关日志。此输入框会自动使用代码格式，无需添加反引号。
        Please copy and paste any relevant logs below. Code formatting is
        enabled, so there is no need for backticks.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / Additional information
      description: >
        如有其他有助于定位问题的信息，请在此补充。 / If you have any additional information that may help us diagnose the issue, add it here.

  - type: markdown
    attributes:
      value: 感谢你的反馈。 / Thank you for submitting the form.
