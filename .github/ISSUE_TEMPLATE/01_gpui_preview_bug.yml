name: 🧪 GPUI 预览版 Bug / GPUI Preview bug
description: 报告 NyaTerm GPUI Preview 中可复现的问题 / Report a reproducible issue in a NyaTerm GPUI Preview release
title: "[GPUI Preview Bug]: "
labels: ["bug", "gpui-preview", "needs-triage"]

body:
  - type: checkboxes
    id: preview-checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索现有的 Issue（包括已关闭的），没有发现重复问题。 / I searched existing open and closed issues and did not find a duplicate.
          required: true
        - label: 我正在使用 NyaTerm GPUI Preview 版本。 / I am using a GPUI Preview release of NyaTerm.
          required: true

  - type: markdown
    attributes:
      value: |
        感谢你测试 NyaTerm GPUI Preview。

        提交前请从日志和截图中移除密码、私钥、访问令牌、主机凭据以及其他敏感信息。

        Thanks for testing NyaTerm GPUI Preview.

        Please remove passwords, private keys, access tokens, host credentials, and other sensitive information from logs and screenshots before submitting.

  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: NyaTerm Preview 版本 / NyaTerm Preview version
      description: 请填写 NyaTerm 中显示或下载版本对应的版本号。 / Use the version shown in NyaTerm or in the downloaded release.
      placeholder: v2.0.0-preview.1

  - type: dropdown
    id: platform
    validations:
      required: true
    attributes:
      label: 平台 / Platform
      options:
        - Windows
        - macOS
        - Linux
        - 其他 / Other

  - type: input
    id: os-version
    validations:
      required: true
    attributes:
      label: 操作系统版本 / OS version
      placeholder: Windows 11 24H2, macOS 26, Ubuntu 24.04...

  - type: dropdown
    id: architecture
    validations:
      required: true
    attributes:
      label: 系统架构 / Architecture
      options:
        - x86_64 / x64
        - arm64 / aarch64
        - 其他 / 未知 / Other / unknown

  - type: dropdown
    id: package
    validations:
      required: true
    attributes:
      label: 安装包 / Installation package
      options:
        - Windows 安装版 / Windows installer
        - Windows 便携版 / Windows portable
        - macOS 安装包 / macOS package
        - Linux AppImage
        - Linux deb
        - Linux rpm
        - 从源码构建 / Built from source
        - 其他 / Other

  - type: dropdown
    id: area
    validations:
      required: true
    attributes:
      label: 受影响范围 / Affected area
      multiple: true
      options:
        - 终端 / Terminal
        - SSH / Telnet / Serial
        - SFTP / 文件传输 / File Transfer
        - 文件浏览器 / File Explorer
        - RDP
        - VNC
        - AI Assistant
        - 设置 / Settings
        - 同步 / 备份 / Sync / Backup
        - 窗口 / UI / Window / UI
        - 安装 / 更新 / Installer / Updater
        - 其他 / Other

  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: 发生了什么？ / What happened?
      description: 请描述实际行为及其影响。 / Describe the actual behavior and its impact.

  - type: textarea
    id: expected
    validations:
      required: true
    attributes:
      label: 预期行为 / Expected behavior
      description: 请描述你期望 NyaTerm 如何表现。 / Describe what you expected NyaTerm to do.

  - type: textarea
    id: repro
    validations:
      required: true
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 请提供能够稳定复现问题的最短步骤。 / Provide the shortest reliable sequence that reproduces the issue.
      value: |
        1.
        2.
        3.

  - type: dropdown
    id: stable
    validations:
      required: true
    attributes:
      label: 稳定版是否也会出现这个问题？ / Does this also happen in the stable version?
      description: 这有助于区分 GPUI 回归问题和已有行为。 / This helps distinguish GPUI regressions from existing behavior.
      options:
        - "否 / No"
        - "是 / Yes"
        - 未测试 / Not tested
        - 不适用 / Not applicable

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant log output
      description: 请在移除 Secret 和敏感信息后粘贴相关日志。 / Paste relevant logs after removing secrets and sensitive information.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏 / Screenshots or recordings
      description: 如果截图或录屏有助于说明问题，可以拖放到这里。 / Drag and drop screenshots or recordings here if they help explain the issue.

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / Additional information
      description: 请补充任何可能有助于复现或定位问题的信息。 / Add any other context that may help reproduce or diagnose the issue.

  - type: markdown
    attributes:
      value: 感谢你帮助改进 NyaTerm GPUI Preview。 / Thank you for helping improve NyaTerm GPUI Preview.
